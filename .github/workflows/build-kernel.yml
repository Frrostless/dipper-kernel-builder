name: Build Dipper Kernel 4.9 with Droidspaces

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Xiaomi kernel branch (dipper-o-oss / dipper-p-oss / dipper-q-oss)'
        required: false
        default: 'dipper-q-oss'
        type: choice
        options:
          - dipper-o-oss
          - dipper-p-oss
          - dipper-q-oss
      defconfig:
        description: 'Defconfig name'
        required: false
        default: 'dipper_user_defconfig'
        type: string
      menustuff:
        description: 'Disable menuconfig (always yes)'
        required: false
        default: 'true'
        type: boolean

env:
  KBUILD_BUILD_USER: github-actions
  KERNEL_BRANCH: ${{ inputs.kernel_branch || 'dipper-q-oss' }}
  DEFCONFIG: ${{ inputs.defconfig || 'dipper_user_defconfig' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex patch pkg-config git curl tar xz-utils zip unzip \
            cpio rsync kmod perl python3 python-is-python3 libssl-dev libelf-dev pahole \
            libncurses-dev zlib1g-dev libyaml-dev lz4 zstd device-tree-compiler \
            jq wget

      - name: Setup Proton Clang 12
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          git clone --depth=1 https://github.com/ravindu644/proton-12.git proton-12
          echo "Proton Clang version:"
          ~/toolchains/proton-12/bin/clang --version | head -1

      - name: Setup Linaro GCC 7.5
        run: |
          cd ~/toolchains
          curl -Lf -o linaro.tar.xz \
            "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/linaro-aarch64-7.5.tar.xz"
          mkdir -p aarch64-linaro-7.5
          tar -xJf linaro.tar.xz -C aarch64-linaro-7.5 --strip-components=1
          rm linaro.tar.xz
          echo "Linaro GCC version:"
          ~/toolchains/aarch64-linaro-7.5/bin/aarch64-linux-gnu-gcc --version | head -1

      - name: Setup magiskboot
        continue-on-error: true
        run: |
          cd ~/toolchains
          MAGISK_URL=$(curl -sL https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | jq -r '.assets[] | select(.name | test("Magisk-v.*\\.apk$")) | .browser_download_url' \
            | head -1)
          echo "Magisk URL: $MAGISK_URL"
          if [ -z "$MAGISK_URL" ]; then
            echo "WARNING: Could not find Magisk APK URL. magiskboot will not be available."
            exit 0
          fi
          curl -Lf -o /tmp/magisk.apk "$MAGISK_URL" || { echo "WARNING: Magisk download failed."; exit 0; }
          cd /tmp && unzip -o magisk.apk "lib/x86_64/libmagiskboot.so" || { echo "WARNING: libmagiskboot.so not found in APK."; exit 0; }
          cp lib/x86_64/libmagiskboot.so ~/toolchains/magiskboot || { echo "WARNING: Failed to copy magiskboot."; exit 0; }
          chmod +x ~/toolchains/magiskboot
          rm -rf /tmp/magisk.apk /tmp/lib

      - name: Clone Xiaomi Mi 8 kernel source
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git ~/kernel_src
          cd ~/kernel_src
          echo "Kernel version: $(make kernelversion 2>/dev/null || cat Makefile | head -5)"
          echo "Defconfig: $DEFCONFIG"

      - name: Download and apply patches
        run: |
          cd ~/kernel_src
          mkdir -p ~/patches

          # Droidspaces non-GKI patches
          DROID_BASE="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI"

          curl -Lf -o ~/patches/droid_01.patch "$DROID_BASE/01.fix_kernel_panic_in_xt_qtaguid.patch" 2>/dev/null || true
          curl -Lf -o ~/patches/droid_02.patch "$DROID_BASE/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch" 2>/dev/null || true

          for p in ~/patches/droid_*.patch; do
            [ -f "$p" ] || continue
            echo "Applying: $p"
            patch -p1 --dry-run < "$p" 2>/dev/null && patch -p1 < "$p" \
              || echo "  Patch $p skipped (already applied or not applicable)"
          done

          # Build fix patches
          FIX_BASE="https://raw.githubusercontent.com/ravindu644/Android-Kernel-Tutorials/main/patches"
          FIX_PATCHES=(
            "009.fix-Werror.patch"
            "018.yylloc.patch"
            "017.nuke_dirty_string.patch"
          )

          for p in "${FIX_PATCHES[@]}"; do
            echo "Downloading: $p"
            curl -Lf -o ~/patches/"$p" "$FIX_BASE/$p" 2>/dev/null || { echo "  Download failed: $p"; continue; }
            echo "Applying: $p"
            patch -p1 --dry-run < ~/patches/"$p" 2>/dev/null && patch -p1 < ~/patches/"$p" \
              || echo "  Patch $p skipped (already applied or not applicable)"
          done

          # Fix: add stpcpy implementation for Clang (GCC builtin not available in Clang)
          echo "Applying: stpcpy fix"
          cat > /tmp/stpcpy.patch << 'ENDPATCH'
--- a/lib/string.c
+++ b/lib/string.c
@@ -426,6 +426,19 @@
 EXPORT_SYMBOL(strcpy);
 
 /**
+ * stpcpy - Copy a %NUL terminated string and return pointer to end
+ * @dest: Where to copy the string to
+ * @src: Where to copy the string from
+ */
+char *stpcpy(char *dest, const char *src)
+{
+	while ((*dest++ = *src++) != '\0')
+		/* nothing */;
+	return --dest;
+}
+EXPORT_SYMBOL(stpcpy);
+
+/**
  * strncpy - Copy a length-limited, C-string
  * @dest: Where to copy the string to
  * @src: Where to copy the string from
ENDPATCH
          patch -p1 --dry-run < /tmp/stpcpy.patch 2>/dev/null && patch -p1 < /tmp/stpcpy.patch \
            || echo "  stpcpy patch skipped (already applied or not applicable)"

      - name: Copy config fragments
        run: |
          cd ~/kernel_src
          mkdir -p arch/arm64/configs
          cp "$GITHUB_WORKSPACE/config/droidspaces.config" arch/arm64/configs/
          cp "$GITHUB_WORKSPACE/config/custom.config" arch/arm64/configs/
          echo "Config files in arch/arm64/configs/:"
          ls -la arch/arm64/configs/ | grep -E "droidspaces|custom|dipper"

      - name: Build kernel
        run: |
          cd ~/kernel_src
          # Linaro first so aarch64-linux-gnu-* tools are found before Proton
          export PATH="$HOME/toolchains/aarch64-linaro-7.5/bin:$HOME/toolchains/proton-12/bin:$HOME/toolchains:$PATH"
          export LD_LIBRARY_PATH="$HOME/toolchains/proton-12/lib:$HOME/toolchains/proton-12/lib64:${LD_LIBRARY_PATH:-}"

          # Remove Proton Clang's 'as' to force Clang integrated assembler
          rm -f ~/toolchains/proton-12/bin/as

          BUILD_OPTIONS=(
            -j"$(nproc)"
            ARCH=arm64
            CC=clang
            HOSTCC=gcc
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LD=aarch64-linux-gnu-ld
            O="$HOME/kernel_src/out"
          )

          echo "=== Generating .config ==="
          make "${BUILD_OPTIONS[@]}" "$DEFCONFIG" droidspaces.config custom.config

          echo "=== Running olddefconfig ==="
          make "${BUILD_OPTIONS[@]}" olddefconfig

          echo "=== Kernel version: $(make "${BUILD_OPTIONS[@]}" kernelversion) ==="
          echo "=== Compiling with $(nproc) threads ==="
          make "${BUILD_OPTIONS[@]}" Image

          # Copy output
          mkdir -p ~/output
          cp out/arch/arm64/boot/Image ~/output/
          cp out/.config ~/output/kernel.config

          echo "=== Build complete ==="
          ls -lh ~/output/

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel-image
          path: ~/output/Image
          retention-days: 30

      - name: Upload kernel config
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel-config
          path: ~/output/kernel.config
          retention-days: 30
